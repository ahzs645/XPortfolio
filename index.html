<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="%BASE_URL%favicon.ico" />
    <link rel="apple-touch-icon" href="%BASE_URL%favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <meta name="theme-color" content="#245edc" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="XPortfolio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <title>Windows XP</title>
    <style>
      /* Prevent flash of unstyled content */
      html, body, #root {
        height: 100%;
        height: 100dvh; /* Dynamic viewport height for iOS */
        margin: 0;
        padding: 0;
        background: #000;
        overflow: hidden;
      }
      /* Fallback using CSS variable for older browsers */
      :root {
        --real-vh: 1vh;
        --font-franklin-gothic-medium-woff2: url("%BASE_URL%fonts/Franklin Gothic Medium.woff2");
      }
    </style>
    <script>
      // Fix for iOS viewport height
      function setRealVh() {
        const vh = window.innerHeight * 0.01;
        document.documentElement.style.setProperty('--real-vh', vh + 'px');
      }
      setRealVh();
      window.addEventListener('resize', setRealVh);
      window.addEventListener('orientationchange', function() {
        setTimeout(setRealVh, 100);
      });
    </script>
  </head>
  <body>
	    <div id="root"></div>
	    <script type="module" src="/src/main.jsx"></script>
	  </body>
	</html>
